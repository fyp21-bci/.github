<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCI Dual Mode Stimulus</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.8);
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            border: 1px solid #333;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        input[type="number"] {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            width: 60px;
            text-align: center;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button.stop {
            background: #dc3545;
        }

        button.stop:hover {
            background: #a71d2a;
        }

        #modeBtn {
            background: #28a745;
        }

        #modeBtn:hover {
            background: #218838;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <div id="controls">
        <div class="control-group">
            <label for="freqLeft">Left Freq (Hz)</label>
            <input type="number" id="freqLeft" value="1" step="0.1" min="0.1">
        </div>
        <div class="control-group">
            <label for="freqRight">Right Freq (Hz)</label>
            <input type="number" id="freqRight" value="2" step="0.1" min="0.1">
        </div>
        <button id="toggleBtn">Start</button>
        <button id="modeBtn">Switch to SSVEP</button>
    </div>

    <canvas id="stimulusCanvas"></canvas>

    <script>
        const canvas = document.getElementById('stimulusCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('toggleBtn');
        const modeBtn = document.getElementById('modeBtn');
        const inputLeft = document.getElementById('freqLeft');
        const inputRight = document.getElementById('freqRight');

        let isRunning = false;
        let animationId;
        let startTime = null;
        let mode = 'MOTION'; // 'MOTION' or 'SSVEP'

        // Configuration
        const DOT_RADIUS = 30;
        let amplitude = 200;

        // State
        let leftFreq = 1.0;
        let rightFreq = 2.0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Amplitude for Motion Mode
            amplitude = (canvas.width / 2) - DOT_RADIUS;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function draw(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = (timestamp - startTime) / 1000; // Seconds

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (mode === 'MOTION') {
                drawMotion(elapsed);
            } else {
                drawSSVEP(elapsed);
            }

            if (isRunning) {
                animationId = requestAnimationFrame(draw);
            }
        }

        function drawMotion(elapsed) {
            const centerX = canvas.width / 2;
            const topY = canvas.height / 4;
            const bottomY = (canvas.height / 4) * 3;

            // Horizontal Motion for Top/Bottom layout
            const topX = centerX - (amplitude * Math.sin(2 * Math.PI * leftFreq * elapsed));
            const bottomX = centerX - (amplitude * Math.sin(2 * Math.PI * rightFreq * elapsed));

            // Draw Top Dot
            ctx.beginPath();
            ctx.arc(topX, topY, DOT_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // Draw Bottom Dot
            ctx.beginPath();
            ctx.arc(bottomX, bottomY, DOT_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        function drawSSVEP(elapsed) {
            const centerY = canvas.height / 2;
            const leftX = canvas.width / 4;
            const rightX = (canvas.width / 4) * 3;

            // Square wave flicker logic: sin > 0 ? 1 : 0
            // This is a standard simple SSVEP stimulation pattern
            const leftOpacity = Math.sin(2 * Math.PI * leftFreq * elapsed) > 0 ? 1 : 0;
            const rightOpacity = Math.sin(2 * Math.PI * rightFreq * elapsed) > 0 ? 1 : 0;

            // Left Dot (Flickering)
            ctx.save();
            ctx.globalAlpha = leftOpacity;
            ctx.beginPath();
            // Typically SSVEP stimuli are larger to evoke stronger response
            ctx.arc(leftX, centerY, DOT_RADIUS * 2, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.restore();

            // Right Dot (Flickering)
            ctx.save();
            ctx.globalAlpha = rightOpacity;
            ctx.beginPath();
            ctx.arc(rightX, centerY, DOT_RADIUS * 2, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.restore();
        }

        function toggleAnimation() {
            if (isRunning) {
                isRunning = false;
                cancelAnimationFrame(animationId);
                btn.textContent = 'Start';
                btn.classList.remove('stop');
                startTime = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Redraw static state based on mode
                if (mode === 'MOTION') initialDrawMotion();
                else initialDrawSSVEP();
            } else {
                isRunning = true;
                btn.textContent = 'Stop';
                btn.classList.add('stop');
                leftFreq = parseFloat(inputLeft.value);
                rightFreq = parseFloat(inputRight.value);
                requestAnimationFrame(draw);
            }
        }

        function toggleMode() {
            // Stop if running to avoid state confusion
            if (isRunning) toggleAnimation();

            if (mode === 'MOTION') {
                mode = 'SSVEP';
                modeBtn.textContent = 'Switch to Motion';
                inputLeft.value = 8;
                inputRight.value = 13;
            } else {
                mode = 'MOTION';
                modeBtn.textContent = 'Switch to SSVEP';
                inputLeft.value = 1;
                inputRight.value = 2;
            }

            // Update internal frequency state
            leftFreq = parseFloat(inputLeft.value);
            rightFreq = parseFloat(inputRight.value);

            // Clear and redraw static
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (mode === 'MOTION') initialDrawMotion();
            else initialDrawSSVEP();
        }

        function initialDrawMotion() {
            const centerX = canvas.width / 2;
            const topY = canvas.height / 4;
            const bottomY = (canvas.height / 4) * 3;

            ctx.beginPath();
            ctx.arc(centerX, topY, DOT_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(centerX, bottomY, DOT_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();
        }

        function initialDrawSSVEP() {
            const centerY = canvas.height / 2;
            const leftX = canvas.width / 4;
            const rightX = (canvas.width / 4) * 3;

            ctx.beginPath();
            ctx.arc(leftX, centerY, DOT_RADIUS * 2, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(rightX, centerY, DOT_RADIUS * 2, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();
        }

        inputLeft.addEventListener('input', (e) => {
            leftFreq = parseFloat(e.target.value) || 0;
        });

        inputRight.addEventListener('input', (e) => {
            rightFreq = parseFloat(e.target.value) || 0;
        });

        btn.addEventListener('click', toggleAnimation);
        modeBtn.addEventListener('click', toggleMode);

        // Initial setup
        initialDrawMotion();

    </script>
</body>

</html>
